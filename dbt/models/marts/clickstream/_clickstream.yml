version: 2

models:
  - name: fact_clickstream_sessions
    description: "Clickstream session fact. Grain: một dòng cho mỗi session_id."

    columns:
      - name: session_id
        data_tests:
          - not_null
          - unique

      - name: session_start_at
        data_tests:
          - not_null

      - name: session_end_at
        data_tests:
          - not_null

      - name: start_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: end_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: event_count
        data_tests:
          - not_null

      - name: session_duration_seconds
        data_tests:
          - not_null

      - name: is_cross_date_session
        data_tests:
          - not_null

      - name: session_count
        data_tests:
          - not_null