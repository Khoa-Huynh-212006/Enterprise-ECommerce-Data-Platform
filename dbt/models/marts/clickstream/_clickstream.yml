version: 2

models:
  - name: fact_clickstream_sessions
    description: "Clickstream session fact. Grain: một dòng cho mỗi session_id."

    columns:
      - name: session_id
        data_tests:
          - not_null
          - unique

      - name: session_start_at
        data_tests:
          - not_null

      - name: session_end_at
        data_tests:
          - not_null

      - name: start_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: end_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: event_count
        data_tests:
          - not_null

      - name: session_duration_seconds
        data_tests:
          - not_null

      - name: is_cross_date_session
        data_tests:
          - not_null

      - name: session_count
        data_tests:
          - not_null
          
  - name: agg_clickstream_daily
    description: "Daily clickstream aggregate mart. Grain: một dòng cho mỗi calendar date."

    columns:
      - name: date_key
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: event_date
        data_tests:
          - not_null
          - unique

      - name: event_count
        data_tests:
          - not_null

      - name: active_session_count
        data_tests:
          - not_null

      - name: distinct_item_count
        data_tests:
          - not_null

      - name: distinct_category_count
        data_tests:
          - not_null

      - name: sessions_started
        data_tests:
          - not_null