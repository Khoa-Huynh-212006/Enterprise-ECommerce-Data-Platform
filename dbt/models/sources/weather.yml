version: 2

sources:
  - name: staging_weather
    database: fastorder_dwh
    schema: staging
    description: "Weather Silver được Spark load từ Delta Lake vào PostgreSQL DWH."

    tables:
      - name: weather_forecast_hourly
        columns:
          - name: warehouse_id
            data_tests:
              - not_null
          - name: ingestion_id
            data_tests:
              - not_null
          - name: snapshot_at
            data_tests:
              - not_null
          - name: forecast_time
            data_tests:
              - not_null

      - name: weather_historical_forecast_hourly
        columns:
          - name: warehouse_id
            data_tests:
              - not_null
          - name: weather_time
            data_tests:
              - not_null
          - name: ingestion_id
            data_tests:
              - not_null